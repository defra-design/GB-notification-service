<div class="app-consignment-add-address-page__search-block">
  <div
    class="app-address-book-lookup-page__search{% if data.errors and data.errors.addressLookup %} app-address-book-lookup-page__search--error{% endif %}"
    data-module="app-address-book-lookup-search"
    data-manual-section="#consignment-manual-address"
    data-manual-link=".app-consignment-add-address-page__manual-link"
    data-manual-toggle=".app-consignment-add-address-page__manual-toggle"
    data-manual-entry="#consignment-manual-address-entry"
    data-reveal-with-address=".app-consignment-add-address-page__usage"
  >
    <label class="govuk-label app-address-book-lookup-page__search-label app-consignment-add-address-page__search-label" for="consignment-address-lookup-search">
      Search for an address
    </label>

    {% if data.errors and data.errors.addressLookup %}
      <p id="consignment-address-lookup-search-error" class="govuk-error-message">
        <span class="govuk-visually-hidden">Error:</span>
        {{ data.errors.addressLookup.text }}
      </p>
    {% endif %}

    <script type="application/json" class="app-address-book-lookup-search__data">{{ lookupAddressesJson | safe }}</script>

    <div class="app-commodity-search-wrapper app-address-book-lookup-page__search-wrapper app-consignment-add-address-page__search-wrapper">
      <div class="app-commodity-search-panel">
        <div
          class="app-commodity-search"
          aria-expanded="false"
          aria-controls="consignment-address-lookup-search-results"
        >
          <input
            class="app-commodity-search__input{% if data.errors and data.errors.addressLookup %} govuk-input--error{% endif %}"
            id="consignment-address-lookup-search"
            type="search"
            autocomplete="off"
            placeholder="Start typing..."
            aria-controls="consignment-address-lookup-search-results"
            {% if data.errors and data.errors.addressLookup %}aria-describedby="consignment-address-lookup-search-error"{% endif %}
            value="{{ addressLookup or '' }}"
          >
          <button class="app-commodity-search__button" type="button" aria-label="Search">
            <span class="govuk-visually-hidden">Search</span>
            <svg class="app-commodity-search__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20.3765 20" width="20" height="20" aria-hidden="true" focusable="false">
              <path d="M8.90084 14.4683C12.3848 14.4683 15.2091 11.644 15.2091 8.16008C15.2091 4.67613 12.3848 1.85184 8.90084 1.85184C5.41689 1.85184 2.59259 4.67613 2.59259 8.16008C2.59259 11.644 5.41689 14.4683 8.90084 14.4683Z" stroke="currentColor" stroke-width="2.22222" fill="none"/>
              <path d="M13.2347 12.8583L19.5908 19.2143" stroke="currentColor" stroke-width="2.22222" fill="none"/>
            </svg>
          </button>
        </div>
        <ul
          id="consignment-address-lookup-search-results"
          class="app-commodity-search__results"
          role="list"
          aria-label="Address search results"
          hidden
        ></ul>
      </div>

      <input
        type="hidden"
        name="addressLookup"
        class="app-address-book-lookup-search__value"
        value="{{ addressLookup or '' }}"
      >
      <input
        type="hidden"
        name="addressBookLookupAddressId"
        class="app-address-book-lookup-search__id"
        value="{{ selectedLookupAddressId or '' }}"
      >
      <div class="app-address-book-lookup-search__status govuk-visually-hidden" aria-live="polite"></div>
    </div>
  </div>

  <p class="app-consignment-add-address-page__manual-link app-address-book-lookup-page__manual-link{% if not showManualAddress %} app-address-book-lookup-page__manual-link--hidden{% endif %}">
    <button
      type="button"
      class="govuk-link app-govuk-body-link app-consignment-add-address-page__manual-toggle"
      aria-controls="consignment-manual-address"
      aria-expanded="{{ 'true' if showManualAddress else 'false' }}"
    >
      Enter address manually
    </button>
  </p>
</div>

<input
  type="hidden"
  name="manualAddressEntry"
  value="true"
  id="consignment-manual-address-entry"
  {% if not showManualAddress %}disabled{% endif %}
>

<div
  class="app-consignment-add-address-page__address-form app-address-book-lookup-page__manual{% if not showManualAddress %} app-address-book-lookup-page__manual--hidden{% endif %}"
  id="consignment-manual-address"
>
  {% include "partials/design-release-2.1/consignment-uk-manual-address-fields.html" %}
  {% include "partials/design-release-2.1/consignment-uk-contact-fields.html" %}
</div>
